[build]
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Dua variabel ini hanya dibaca di sisi server (lib/server/auth.ts); nilainya tidak dibundel ke klien.
  # Nilai pendek/umum dapat cocok dengan teks biasa di repo, sehingga dikecualikan dari pemindaian.
  SECRETS_SCAN_OMIT_KEYS = "OPERATOR_PASSCODE,ADMIN_PASSCODE,SESSION_SECRET"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback: deep link seperti /dashboard disajikan oleh index.html (file statis dan fungsi /api/* diutamakan).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Header keamanan dasar. 'unsafe-inline' pada style dibutuhkan atribut style React; script tetap hanya dari 'self'.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self'; font-src 'self'; frame-src https://maps.google.com https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
